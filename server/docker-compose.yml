version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: T-SHOP
      MYSQL_USER: tshop
      MYSQL_PASSWORD: tshop
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=tshop
      - MYSQL_PASSWORD=tshop
      - MYSQL_DATABASE=T-SHOP
      - DB_CLIENT=mysql2
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - ..:/app
volumes:
  db_data:
